
<HTML> 
 <HEAD> 
  <TITLE>링크된 그림위로 마우스가 올라가면 그림에 필터 효과가 나면서 지정한 그림으로 변합니다.</TITLE> 
<script type="text/javascript">

//필터효과지정하는곳 CSS (transition=0 to 23)번호에따라 효과가 틀림 
document.write('<STYLE TYPE="text/css">.imgTrans{ filter: revealTrans (duration=0.4,transition=17) }</STYLE>');

//Uncomment the next line for fading rollovers instead of dissolving:
//document.write('<STYLE TYPE="text/css">.imgTrans{ filter:blendTrans(duration=0.4) }</STYLE>');

var onImages=new Array();
function Rollover(imgName, imgSrc)
{onImages[imgName] = new Image();
onImages[imgName].src = imgSrc;}


function turnOn(imgName){ 
if(document.images[imgName].filters != null)
document.images[imgName].filters[0].apply();
document.images[imgName].offSrc = document.images[imgName].src;
document.images[imgName].src    = onImages[imgName].src;
if(document.images[imgName].filters != null)
document.images[imgName].filters[0].play();
}


function turnOff(imgName){ 
if(document.images[imgName].filters != null)
document.images[imgName].filters[0].stop();
document.images[imgName].src = document.images[imgName].offSrc;}


//메뉴의 이름지정과 마우스 올라갔을 때 보여질 그림의 주소 적는 곳:
Rollover("menu1",  "http://gif00.com.ne.kr/1/buton/img.gif");
Rollover("menu2", "http://gif00.com.ne.kr/1/buton/java.gif");

</script>

 </HEAD> 

<BODY>

<p><a href = "http://gif00.com.ne.kr/1/imgmain.html"
onMouseOver="turnOn('menu1');"
onMouseOut="turnOff('menu1');"><img name="menu1" class="imgTrans" 
src="http://gif00.com.ne.kr/1/buton/imgon.gif" border="0"></a><br>
<a href = "http://gif00.com.ne.kr/java/list/back.html"
onMouseOver="turnOn('menu2');"
onMouseOut="turnOff('menu2');"><img name="menu2" class="imgTrans"
src="http://gif00.com.ne.kr/1/buton/javaon.gif" border="0"></a><br>
</p>

<BODY>
<p>&nbsp;</p>
</HTML>
