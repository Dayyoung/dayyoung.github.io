##
## 각 항목에 링크될 아이콘을 지정한다.
## 첫부분에 / 가 있을경우 Document Root 디렉토리를 기준으로
## 해석되고, / 없이 시작할경우 본 CGI가 위치한 디렉토리를
## 기준으로 해석된다.
##
IconAdmin  = icon/admin.gif
IconHome   = icon/home.gif
IconBack   = icon/back.gif
IconHelp   = icon/help.gif

IconList   = icon/list.gif
IconReload = icon/reload.gif
IconWrite  = icon/write.gif
IconModify = icon/modify.gif
IconReply  = icon/reply.gif
IconDelete = icon/delete.gif

IconUp     = icon/up.gif
IconDown   = icon/down.gif

##
## Define filetype
## In this section, you can define filetype and icon file.
## There is a rule, see below
##
## 1. IconType-EXTENSION      = ICON_File     // Link
## 2. IconTypeText-EXTENSION  = ICON_File     // Link + Show brief text
## 3. IconTypeImage-EXTENSION = ICON_File     // Link + Show image
## 4. IconTypeSound-EXTENSION = ICON_File     // Link + Play sound
## 5. IconTypeMovie-EXTENSION = ICON_File     // Link + Play movie
##
## If there is a song file named 'exam.abc'. And the format of this file
## is same as 'wav' format. And you want to play this song file when you
## see the article which include the song file. You can define file type
## and file icon.
##
## ex) IconTypeSound-ABC = icon/type/abc.gif 
##
## 업로드된 파일의 확장자에 따른 표시 아이콘을 정한다.
## 기본적인 형식은 다음과 같다.
##
## 1. IconType-EXTENSION      = ICON_File     // 다운로드 
## 2. IconTypeText-EXTENSION  = ICON_File     // 다운로드 + 몇줄을 뿌려줌
## 3. IconTypeImage-EXTENSION = ICON_File     // 다운로드 + 그림 보여줌
## 4. IconTypeSound-EXTENSION = ICON_File     // 다운로드 + Play sound
## 5. IconTypeMovie-EXTENSION = ICON_File     // 다운로드 + Play movie
##
## 1번은 다운로드 링크만이 표시된다.
## 2번은 ASCII형식의 파일로써 게시물을 읽을때 몇라인을 간략히 보여준다.
## 3번은 게시물을 읽을때 그림을 같이 보여준다.
## 4번과 5번은 embbed 테그로써 플레이가 가능한 파일일때 지정한다.
## 차이점은 embbed될 객체의 윈도우 크기를 다르다.
## 
## 아이콘의 크기는 16 * 16 이 가장 적절하며, 그 이상의 크기로 저장되었다
## 하여도, 아래의 IconWidth, IconHeight로 조절되어 표시된다.
##
IconWidth  = 16
IconHeight = 16
IconOpen   = icon/open.gif
IconClose  = icon/close.gif
IconTypeDefault = icon/type/default.gif
IconTypeUnknown = icon/type/unknown.gif
