##
## Program information.
## 'ProgramName' must be modified when you rename the executable CGI filename.
##
## 실행파일 이름과 버젼을 기술한다.
## 만약 실행파일의 이름을 변경하였을경우엔, 아래의 ProgramName 또한
## 동일하게 변경하여야 한다.
##
ProgramName    = CrazyWWWBoard.cgi
#ProgramName    = bbs.cgi
ProgramVersion = 3.0.1

##
## When the CGI create a file or a directory. the CGI will adjust
## it's permission.
##
## Permission | Value
##    0777       511
##    0755       493
##    0666       438
##    0644       420
##
## CGI에서 다룰 디렉토리와 파일의 생성 초기 상태이다.
## 위의 값들을 직접 사용해야 하는 경우는 없고, 단순히
## 아래의 설명에따라 #을 제거하고 첨부하는것으로 충분하다.
##
## If your web server's UID and GID are not same yours, make sure
## 'wwwboard/data' permission 0777 and 'wwwboard/logs' permission 0777
## and uncomment below two entries.
##
## 만약, CGI가 설치된 환경의 UID, GID와 웹서버의 UID, GID가 다를경우
## 아래 2줄을 활성화(# 제거) 시키도록 한다.
## 또한 'wwwboard/data' 디렉토리와 'wwwboard/logs' 디렉토리의 퍼미션을
## 0777로 설정하여야 한다.
##
#FilePermission      = 438
#DirectoryPermission = 511
##
## If your UID and GID are same as web server's make sure below
## two entries uncommented and above two entries commented.
##
## 만약, CGI와 웹서버의 UID, GID가 같다면, 아래 2줄을 활성화 시킨다.
##
FilePermission      = 420
DirectoryPermission = 493

##
## Definition of database directory and database file extension. 
## Database file which is named 'DB_NAME.DataExtension' will be
## located in 'DataDirectory'
##
## 게시판 데이터베이스가 저장될 디렉토리와 데이터베이스 파일의
## 확장자를 기술한다.
##
DataDirectory = data
DataExtension = gdbm

##
## Log Filename
##
## 모든 억세스는 로그파일에 기록된다.
## 로그파일의 위치와 이름을 적절히 설정한다.
##
AccessLog = /dev/null
ErrorLog  = /dev/null

##
## System default HTML header & tailer.
##
## 시스템에 기본으로 사용되는 HTML Header, Tailer 파일이다.
## 즉, 출력의 상단과 하단에 인용된다.
## 각 DB에서 시스템 디폴트 HTML로 설정했을경우, 적용된다.
## Help는 도움말 아이콘이 링크될 파일의 경로이다.
##
HtmlHead  = message/head.html
HtmlTail  = message/tail.html
Help      = message/help-kr.txt

##
